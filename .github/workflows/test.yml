name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  NEXTEST_COLOR: always
  # Keep rustup state inside the mise data dir so the mise-action cache
  # restores the full Rust toolchain (not just mise's install marker).
  MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
  MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools with mise
        uses: jdx/mise-action@v5

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - parallel:
          - name: Check formatting
            run: cargo fmt --all -- --check

          - name: Clippy
            run: mise run lint:clippy

          - name: SLOC guard
            run: mise run lint:sloc

          - name: Build
            run: cargo build --release

          - name: Run tests
            run: mise run test
